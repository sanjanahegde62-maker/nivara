spring.application.name=rental-management

# ---------------------------------------------------------------------------
# Database — override all three via environment variables in any deployment.
# DB_PASSWORD has no in-file default; it must be supplied at runtime.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rental_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Flyway — managed by Spring Boot auto-configuration (enabled by default).
# ---------------------------------------------------------------------------
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# JWT — override both via environment variables in any deployment.
# JWT_SECRET has no in-file default; it must be supplied at runtime.
# JWT_EXPIRATION defaults to 3600000 ms (1 hour).
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------------------------------------------------------------------------
# Actuator — expose only the health endpoint for container health checks.
# All other management endpoints are disabled.
# ---------------------------------------------------------------------------
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Error responses — never expose stack traces or internal messages to clients.
# The GlobalExceptionHandler produces structured JSON for all API errors.
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
