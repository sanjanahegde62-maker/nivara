# ---------------------------------------------------------------------------
# Test-scope property overrides.
# This file is on the test classpath only and is never packaged into the
# production artifact.
#
# Sensitive values (TEST_DB_PASSWORD, JWT_SECRET) have no in-file default
# and must be supplied as environment variables before running tests.
#
# For local development, set them once in your shell or IDE run config:
#
#   export TEST_DB_PASSWORD=<your local postgres password>
#   export JWT_SECRET=<any 32+ character string>
#
# Then run:   ./mvnw test
# ---------------------------------------------------------------------------

spring.application.name=rental-management

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/rental_management}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
