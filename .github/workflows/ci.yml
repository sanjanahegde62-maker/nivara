name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rental_management
          # Username is fixed to 'postgres' — must match TEST_DB_USERNAME below.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rental_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # pom.xml and mvnw live in the nested rental-management subdirectory.
        working-directory: rental-management/rental-management
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/rental_management
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 3600000
        run: ./mvnw test -B

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: rental-management/rental-management/target/surefire-reports/
          retention-days: 7
